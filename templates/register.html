
<!DOCTYPE html>
<html>

<head>

    <title>iPon - Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/modern.css') }}">

</head>

<body class="auth-page">

<div class="auth-wrapper">

    <div class="auth-hero">

        <div class="auth-brand">
            iPon
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Start your financial journey today.
        </p>

    </div>

    <div class="auth-card">

        <h2>Register</h2>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button
                type="submit"
                class="auth-btn">

                Create Account

            </button>

        </form>

        {% if error %}
        <p class="auth-error">
            {{ error }}
        </p>
        {% endif %}

        <p class="auth-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

</body>
</html>
