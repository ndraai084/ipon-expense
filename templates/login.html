
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPon - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/modern.css') }}">

</head>

<body class="auth-page">

<div class="auth-wrapper">

    <div class="auth-hero">

        <div class="auth-brand">
            iPon
        </div>

        <h1>
            Welcome Back
        </h1>

        <p>
            Track every peso with confidence.
        </p>

    </div>

    <div class="auth-card">

        <h2>Login</h2>

        <form method="POST">

            <input
                type="text"
                name="identifier"
                placeholder="Username or Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button
                type="submit"
                class="auth-btn">

                Login

            </button>

        </form>

        {% if error %}
        <p class="auth-error">
            {{ error }}
        </p>
        {% endif %}

        <p class="auth-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>

    </div>

</div>

</body>
</html>
